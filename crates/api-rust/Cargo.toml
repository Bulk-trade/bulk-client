[package]
name = "bulk-client"
version = "0.1.2"
description = "High-performance Rust SDK for BULK (HTTP + WebSocket)"
keywords = ["trading", "exchange", "sdk", "websocket", "bulk"]
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[[example]]
name = "md_listener"

[[example]]
name = "account_query"

[[example]]
name = "md_query"

[[example]]
name = "execute_limit"

[[example]]
name = "execute_cond"

[features]
ledger = [
    "dep:solana-remote-wallet",
    "dep:solana-derivation-path",
    "dep:hidapi",
    "dep:parking_lot",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.13.2", features = ["json", "query"] }
tungstenite = "0.28.0"

eyre = "0.6.12"
num_enum = "0.7.4"

# serialization
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.143" }
bincode = { version = "1.3.3"}

bs58 = "0.5.1"
sha2 = "0.10.9"
solana-remote-wallet = { version = "4.0.0-rc.0", default-features = false, features = ["agave-unstable-api", "hidapi"], optional = true }
solana-derivation-path = { version = "3.0.0", optional = true }
hidapi = { version = "2.6.5", optional = true }
parking_lot = { version = "0.12.5", optional = true }

solana-hash = { version = "3.0.1", features = ["serde"] }
solana-signature = { version = "3.0.1", features = ["serde"] }
solana-signer = "3.0.0"
solana-pubkey = { version = "3.0.0", features = ["serde"] }
solana-keypair = "=3.1.2"
solana-offchain-message = "3.0.0"

tracing = "0.1.44"
clap = { version = "4.5.58", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build]
incremental = true
