[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulk-client"
version = "0.1.2"
description = "High-performance Python SDK for BULK"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.2.0",
    "numba>=0.60.0",
    "websockets>=14.0",
    "pynacl>=1.2.0",
    "base58>=2.1.0",
    "sortedcontainers>=2.4.0",
    "aiohttp>=3.11",
    "bulk-keychain>=0.1.5",
    "requests>=2.31.0"
]

[tool.hatch.build.targets.wheel]
packages = ["bulk_api", "bulk_client"]
