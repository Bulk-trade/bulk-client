[package]
name = "random-mm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "random_mm"
path = "src/main.rs"

[dependencies]
bulk-api = { path = "../api-rust" }   # adjust to your actual SDK path
eyre = "0.6"
json5 = "0.4"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5.58", features = ["derive"] }
futures = "0.3.32"
