[package]
name = "bulk-cli-sdk"
version = "0.1.2"
description = "Private SDK-backed action builders for the Bulk CLI"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "bulk-sdk"
path = "src/main.rs"

[workspace]

[dependencies]
bincode = "1.3.3"
bulk-client = { path = "../api-rust", features = ["ledger"] }
bulk-sdk-core = { git = "ssh://git@github.com/Bulk-trade/bulk-sdk.git", rev = "f2eba9a9d334a68ce9b908f8301eb68d80f06ca4" }
clap = { version = "4.5.58", features = ["derive", "env"] }
eyre = "0.6"
json5 = "1.3.1"
serde = "1"
serde_json = "1"
solana-pubkey = "3.0.0"
tokio = { version = "1", features = ["full"] }
