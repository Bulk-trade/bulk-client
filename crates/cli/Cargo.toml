[package]
name = "bulk-cli"
version = "0.1.1"
description = "Command-line interface for trading on BULK"
keywords = ["trading", "exchange", "cli", "bulk"]
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "bulk"
path = "src/main.rs"

[dependencies]
bulk-client = { version = "0.1.1", path = "../api-rust", features = ["ledger"] }

eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5.58", features = ["derive"] }
sha2 = "0.10.9"

solana-hash = { version = "3.0.1", features = ["serde"] }
solana-signature = { version = "3.0.1", features = ["serde"] }
solana-signer = "3.0.0"
solana-pubkey = { version = "3.0.0", features = ["serde"] }
solana-keypair = "=3.0.1"
json5 = "1.3.1"
bulk-sdk-core = { version = "0.1.0", path = "../../../bulk-sdk/core" }
bincode = "1.3.3"
