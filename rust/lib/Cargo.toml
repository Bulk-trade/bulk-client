[package]
name = "bulk-api"
version = "0.1.0"
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
bulk-sdk-core = { path = "../../../bulk-sdk/core" }
eyre = "0.6.12"
num-traits = "0.2.19"
num_enum = "0.7.4"
serde_json = "1.0.143"
tracing = "0.1.41"
rand = "0.9.2"
rand_distr = { version = "0.5.1", features = ["std_math"] }
rand_pcg = "0.9.0"

# make nalgebra compatible with rust 1.88, explicit override needed
wide = "=0.7.33"
safe_arch = "=0.7.4"
nalgebra = "0.32.2"

rayon = "1.11.0"
approx = "0.5.1"

argmin = "0.10"
argmin-math = { version = "0.4.0", features = ["ndarray_latest"] }
ndarray = "0.15"
tempfile = "3.23.0"
bs58 = "0.5.1"
sha2 = "0.10.9"

solana-hash = { version = "3.0.0", features = ["serde"] }
solana-signature = { version = "3.0.0", features = ["serde"] }
solana-signer = "3.0.0"
solana-short-vec = "3.0.0"
solana-pubkey = { version = "3.0.0", features = ["serde"] }
solana-keypair = "3.0.0"
solana-clock = "3.0.0"
ed25519-dalek = "2.2.0"


[dependencies.serde]
workspace = true
features = ["derive", "rc"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3.2.0"

[build]
incremental = true
