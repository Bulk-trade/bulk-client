name: Publish Rust Crates

on:
  workflow_dispatch:
    inputs:
      skip_bulk_client:
        description: "Skip publishing bulk-client (already published)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Rust publish preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Verify workspace versions are aligned
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(python - <<'PY'
          import tomllib
          with open("crates/api-rust/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"
          py_version="$(python - <<'PY'
          import tomllib
          with open("crates/api-python/pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          echo "Rust version:   ${rust_version}"
          echo "Python version: ${py_version}"
          test "${rust_version}" = "${py_version}"

      - name: Cargo build check
        run: |
          cargo check -p bulk-client
          cargo check -p bulk-cli

  publish:
    name: Publish Rust crates to crates.io
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Publish bulk-client
        if: ${{ !inputs.skip_bulk_client }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bulk-client

      - name: Wait for bulk-client in sparse index
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open("crates/api-rust/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"
          url="https://index.crates.io/bu/lk/bulk-client"
          echo "Polling sparse index for bulk-client v${version}..."
          for i in $(seq 1 60); do
            if curl -sS "${url}" 2>/dev/null | grep -q "\"vers\":\"${version}\""; then
              echo "bulk-client v${version} found in sparse index."
              exit 0
            fi
            echo "  attempt ${i}/60 - not yet, sleeping 10s..."
            sleep 10
          done
          echo "bulk-client v${version} not found in sparse index after 10 minutes."
          exit 1

      - name: Publish bulk-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bulk-cli
