name: Publish Rust Crate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Rust publish preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Verify workspace versions are aligned
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(python - <<'PY'
          import tomllib
          with open("crates/api-rust/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"
          py_version="$(python - <<'PY'
          import tomllib
          with open("crates/api-python/pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          echo "Rust version:   ${rust_version}"
          echo "Python version: ${py_version}"
          test "${rust_version}" = "${py_version}"

      - name: Cargo package check
        run: |
          cargo package -p bulk-client --allow-dirty

      - name: Cargo publish dry-run
        run: cargo publish -p bulk-client --dry-run

      - name: Cargo build check (bulk-cli)
        run: cargo check -p bulk-cli

  publish:
    name: Publish Rust crates to crates.io
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Publish bulk-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bulk-client

      - name: Wait for bulk-client availability
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if cargo search bulk-client --limit 1 | grep -q '^bulk-client '; then
              echo "bulk-client is available in crates.io index."
              exit 0
            fi
            echo "Waiting for crates.io index to update (${i}/30)..."
            sleep 10
          done
          echo "bulk-client not visible in crates.io index yet."
          exit 1

      - name: Publish bulk-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bulk-cli
