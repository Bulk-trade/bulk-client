[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulk"
version = "0.1.3"
description = "Bulk Python API"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.2.0",
    "websockets>=14.0",
    "pynacl>=1.2.0",
    "base58>=2.1.0",
    "sortedcontainers>=2.4.0",
    "aiohttp>=3.11",
    "bulk-keychain>=0.1.4"
]

[tool.hatch.build.targets.wheel]
packages = ["bulk"]
